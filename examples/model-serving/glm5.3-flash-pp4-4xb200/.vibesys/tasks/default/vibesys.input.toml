version = 1

[agent]
domain = "llm-serving"

# Run with `--interface service`: the operator's service starts the candidate's
# `vibesys_serve.sh --port PORT` (a fresh server, so empty caches, per
# evaluation) before accuracy and benchmark run. Neither command starts a
# server. The operator appends the server URL and the trusted inputs to both
# commands (README.md, "Interface").
# The candidate starts without vibesys_serve.sh and must write it.

[accuracy]
# Engine-code scan of the candidate root (engine_scan.py), then greedy
# first token and top-10 logprobs against reference.json (the
# contract's TP4 + expert-parallel reference build). About 1M prompt tokens.
command = [
  "uv", "run", "--no-project",
  "--with-requirements", "${PROJECT_ROOT}/.vibesys/tasks/default/requirements.txt",
  "python", "${PROJECT_ROOT}/.vibesys/tasks/default/accuracy_checker/checker.py",
]
timeout_seconds = 600

[benchmark]
# Screening (seconds), corpus tokenization (about 1-3 min), the 20-minute
# session replay, scoring. The benchmark speaks the evaluator result protocol
# (version 2): VibeSys appends `--vs-output <path>`; a rejected run (failed
# request, prefix shortfall, broken prefix cache, p99 TTFT over 60 s) is an
# `error` record. The 6 s SLO is reported (`slo_met`, `slo_margin_s`), not gated.
command = [
  "uv", "run", "--no-project",
  "--with-requirements", "${PROJECT_ROOT}/.vibesys/tasks/default/requirements.txt",
  "python", "${PROJECT_ROOT}/.vibesys/tasks/default/benchmark/session_replay.py",
]
timeout_seconds = 2700
result_protocol = 2
