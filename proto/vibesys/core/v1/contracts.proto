syntax = "proto3";
package vibesys.core.v1;

import "buf/validate/validate.proto";
import "vibesys/core/v1/value_options.proto";
import "vibesys/core/v1/common.proto";
import "vibesys/core/v1/vocabulary.proto";

option go_package = "github.com/uw-syfi/vibesys/gateway/gen/vibesys/core/v1;corev1";

message NullValue {
  option (core_value).null = true;
}

message PureOptionValue {
  option (core_value).union = true;
  oneof value {
    option (buf.validate.oneof).required = true;
    string text = 1;
    string integer = 2 [(buf.validate.field).string.pattern = "^(0|-?[1-9][0-9]*)$", (core_field).integer = true];
    double real = 3 [(buf.validate.field).double.finite = true];
    bool flag = 4;
    NullValue null = 5;
  }
}

// Pure option lifecycle contract.
message PureOption {
  string key = 1 [(buf.validate.field).string.min_len = 1];
  PureOptionValue value = 2 [(buf.validate.field).required = true];
}

// Operation schema ref lifecycle contract.
message OperationSchemaRef {
  option (core_value).narrow_subclasses = true;
  string kind = 1 [(buf.validate.field).string.min_len = 1];
  SchemaRef request_schema = 2 [(buf.validate.field).required = true];
  SchemaRef outcome_schema = 3 [(buf.validate.field).required = true];
  LifecycleClass lifecycle = 4 [(buf.validate.field).enum = {defined_only: true, not_in: 0}];
}

// A retained revision published without changing the operator checkout.
message AdoptionPublication {
  string revision = 1 [(buf.validate.field).string.min_len = 1];
  string commit = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{40}$"];
  string branch = 3 [(buf.validate.field).string.min_len = 1];
}

// The independent, optional checkout step never changes publication success.
message CheckoutUpdate {
  CheckoutStatus status = 1 [(buf.validate.field).enum = {defined_only: true, not_in: 0}];
}

// A sequence may retain an idle slot between members while no job waits for it.
// After yielding to waiting work, its next member reacquires in submission FIFO.
// Scoped by the submitting owner and generation. Closing that scope cancels
// every member and returns any reservation, including after a crash.
message EvaluationLease {
  string key = 1 [(buf.validate.field).string.min_len = 1];
  bool retain = 2;
}

// Exact in-process admission times on the run clock. A queued gate spends only
// the queue hang budget; its execution limit begins at admitted_at.
message EvaluationTiming {
  option (buf.validate.message).cel = {
    id: "evaluation_timing.order"
    message: "admitted_at precedes queued_at"
    expression: "!has(this.admitted_at) || this.admitted_at >= this.queued_at"
  };
  double queued_at = 1 [(buf.validate.field).double = {gte: 0, finite: true}, (core_field).explicit = true];
  optional double admitted_at = 2 [(buf.validate.field).double = {gte: 0, finite: true}];
}
